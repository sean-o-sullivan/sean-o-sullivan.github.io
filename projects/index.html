    <style>
        .row {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            margin-bottom: 1.5em;
        }

        .timespan {
            grid-column: span 1;
            font-size: 14px;
            text-align: right;
            margin-right: 5px;
            color: var(--theme-faint);
        }

        .ico {
            grid-column: span 1;
            vertical-align: top;
            border-left: 2px solid var(--theme-line);
            position: relative;
            padding-left: 15px;
        }

        .desc {
            grid-column: span 10;
            vertical-align: top;
            font-size: 14px;
            padding-left: 20px;
            padding-bottom: 0px;
        }

        .entry-dot {
            position: absolute;
            top: 0px;
            left: -8px;
            width: 10px;
            height: 10px;
            border-radius: 7px;
            background-color: var(--theme-line);
            border: 2px solid var(--theme-bg);
        }

        .unified-image {
            width: 75px;
            height: auto;
            object-fit: contain;
            border-radius: 4%;
            display: block;
            margin-top: 7.5px;
        }

        .project-link {
            color: var(--theme-link);
            text-decoration: underline;
            font-weight: bold;
        }

        .project-description {
            display: inline;
            margin-left: 0.5em;
        }
    </style>
